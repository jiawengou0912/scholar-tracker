<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学术信息追踪 | AI与幼儿发展</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="header-badge">Academic Tracker</div>
        <h1>学术信息追踪</h1>
        <p class="subtitle">AI与幼儿发展 · 教育技术学核心期刊 · 每日自动更新</p>
      </div>
      <div class="header-right">
        <div class="update-card">
          <div class="update-label">数据更新时间</div>
          <div id="update-time" class="update-value">加载中...</div>
        </div>
      </div>
    </div>
  </header>

  <div class="digest-bar" id="digest-bar" style="display:none">
    <div class="digest-inner">
      <div class="digest-head">
        <span class="digest-label">🗞️ 今日研究资讯</span>
        <span class="digest-date" id="digest-date"></span>
        <button class="digest-toggle" id="digest-toggle" onclick="toggleDigest()">收起 ▴</button>
      </div>
      <div class="digest-body" id="digest-body"></div>
    </div>
  </div>

  <nav class="main-nav">
    <div class="nav-inner">
      <button class="nav-btn active" data-section="keyword">
        <span class="nav-icon">🔍</span>AI与幼儿 最新论文
      </button>
      <button class="nav-btn" data-section="journals">
        <span class="nav-icon">📖</span>核心期刊追踪
      </button>
      <button class="nav-btn" data-section="topics">
        <span class="nav-icon">📊</span>热点研究方向
      </button>
    </div>
  </nav>

  <main class="main-content">

    <section id="keyword-section" class="section active">
      <div class="section-header">
        <h2>AI与幼儿发展 最新论文</h2>
        <p class="section-desc">基于关键词检索，来源：Semantic Scholar</p>
      </div>
      <div id="keyword-papers" class="papers-list"></div>
    </section>

    <section id="journals-section" class="section">
      <div class="journals-layout">
        <aside class="journal-sidebar">
          <p class="sidebar-label">选择期刊</p>
          <ul id="journal-list"></ul>
        </aside>
        <div class="journal-main">
          <div id="current-journal-header"></div>
          <div id="journal-papers" class="papers-list"></div>
        </div>
      </div>
    </section>

    <section id="topics-section" class="section">
      <div class="section-header">
        <h2>热点研究方向</h2>
        <p class="section-desc">基于本次抓取论文，按研究方向归类统计</p>
      </div>
      <div id="hot-topics" class="topics-grid"></div>
    </section>

  </main>

  <footer class="site-footer">
    <p>数据来源：CrossRef · Semantic Scholar &nbsp;|&nbsp; 每日 UTC 02:00 自动更新 &nbsp;|&nbsp; AI与幼儿发展研究</p>
  </footer>

  <script>
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.section + '-section').classList.add('active');
      });
    });

    function createCard(paper) {
      const card = document.createElement('div');
      card.className = 'paper-card';

      const venue = paper.venue || paper.journal || '';
      const published = (paper.published || '').slice(0, 7);
      const abstract = paper.abstract || 'Abstract not available.';
      const isLong = abstract.length > 260;
      const shortText = isLong ? abstract.slice(0, 260) + '...' : abstract;
      const authors = (paper.authors || []).slice(0, 3);
      const authorsStr = authors.length
        ? authors.join(', ') + (authors.length >= 3 ? ' et al.' : '')
        : '';

      const accentColors = ['#3b82f6','#8b5cf6','#06b6d4','#10b981','#f59e0b','#ef4444'];
      const colorIndex = Math.abs((venue + paper.title).split('').reduce((a,c) => a + c.charCodeAt(0), 0)) % accentColors.length;
      card.style.setProperty('--accent', accentColors[colorIndex]);

      const meta = document.createElement('div');
      meta.className = 'paper-meta';
      if (venue) {
        const tag = document.createElement('span');
        tag.className = 'paper-venue';
        tag.textContent = venue;
        meta.appendChild(tag);
      }
      if (published) {
        const date = document.createElement('span');
        date.className = 'paper-date';
        date.textContent = published;
        meta.appendChild(date);
      }

      const titleEl = document.createElement('h3');
      titleEl.className = 'paper-title';
      if (paper.url) {
        const a = document.createElement('a');
        a.href = paper.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = paper.title || 'Untitled';
        titleEl.appendChild(a);
      } else {
        titleEl.textContent = paper.title || 'Untitled';
      }

      const abstractWrap = document.createElement('div');
      abstractWrap.className = 'paper-abstract';

      if (authorsStr) {
        const authorsEl = document.createElement('p');
        authorsEl.className = 'paper-authors';
        authorsEl.textContent = authorsStr;
        abstractWrap.appendChild(authorsEl);
      }

      const abstractP = document.createElement('p');
      abstractP.className = 'abstract-text';
      abstractP.textContent = shortText;
      abstractWrap.appendChild(abstractP);

      if (isLong) {
        const btn = document.createElement('button');
        btn.className = 'expand-btn';
        btn.textContent = '展开摘要 ▾';
        btn.addEventListener('click', () => {
          if (btn.textContent.startsWith('展开')) {
            abstractP.textContent = abstract;
            btn.textContent = '收起摘要 ▴';
          } else {
            abstractP.textContent = shortText;
            btn.textContent = '展开摘要 ▾';
          }
        });
        abstractWrap.appendChild(btn);
      }

      card.appendChild(meta);
      card.appendChild(titleEl);
      card.appendChild(abstractWrap);
      return card;
    }

    function renderPapers(containerId, papers) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      if (!papers || !papers.length) {
        container.innerHTML = '<p class="empty-msg">暂无数据，请先运行 fetch_papers.py</p>';
        return;
      }
      papers.forEach(p => container.appendChild(createCard(p)));
    }

    function renderJournalList(journalPapers) {
      const list = document.getElementById('journal-list');
      const names = Object.keys(journalPapers);
      names.forEach((name, i) => {
        const li = document.createElement('li');
        const count = (journalPapers[name] || []).length;
        li.innerHTML = `<span class="journal-name">${name}</span><span class="journal-count">${count}</span>`;
        if (i === 0) li.classList.add('active');
        li.addEventListener('click', () => {
          document.querySelectorAll('#journal-list li').forEach(l => l.classList.remove('active'));
          li.classList.add('active');
          showJournalPapers(name, journalPapers[name]);
        });
        list.appendChild(li);
      });
      if (names.length > 0) showJournalPapers(names[0], journalPapers[names[0]]);
    }

    function showJournalPapers(name, papers) {
      const header = document.getElementById('current-journal-header');
      header.innerHTML = `<h2 class="journal-title">${name}</h2>`;
      renderPapers('journal-papers', papers);
    }

    function renderHotTopics(topics) {
      const container = document.getElementById('hot-topics');
      container.innerHTML = '';
      if (!topics || !topics.length) {
        container.innerHTML = '<p class="empty-msg">暂无数据</p>';
        return;
      }
      const maxCount = Math.max(...topics.map(t => t.count));
      topics.forEach((t, i) => {
        const card = document.createElement('div');
        card.className = 'topic-card';
        card.style.animationDelay = `${i * 0.06}s`;

        const pct = Math.round((t.count / maxCount) * 100);
        const tagsHtml = (t.keywords || [])
          .map(kw => `<span class="topic-tag">${kw}</span>`)
          .join('');

        card.innerHTML = `
          <div class="topic-icon">${t.icon || '📌'}</div>
          <div class="topic-body">
            <div class="topic-name">${t.name}</div>
            <div class="topic-subtitle">${t.subtitle}</div>
            <div class="topic-progress">
              <div class="topic-bar" style="width:${pct}%"></div>
            </div>
            <div class="topic-footer">
              <div class="topic-tags">${tagsHtml}</div>
              <div class="topic-count"><strong>${t.count}</strong> 篇</div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    let digestExpanded = true;
    function toggleDigest() {
      const body = document.getElementById('digest-body');
      const btn = document.getElementById('digest-toggle');
      digestExpanded = !digestExpanded;
      body.style.display = digestExpanded ? 'block' : 'none';
      btn.textContent = digestExpanded ? '收起 ▴' : '展开 ▾';
    }

    function renderDigest(digest, updatedAt) {
      if (!digest) return;
      const bar = document.getElementById('digest-bar');
      const body = document.getElementById('digest-body');
      const dateEl = document.getElementById('digest-date');
      bar.style.display = 'block';
      dateEl.textContent = updatedAt || '';
      const lines = digest.split('\n');
      let html = '';
      for (const line of lines) {
        const t = line.trim();
        if (!t) { html += '<div class="digest-gap"></div>'; continue; }
        if (/^[📌🔥💡]/.test(t)) {
          html += `<div class="digest-section-title">${t}</div>`;
        } else {
          html += `<div class="digest-line">${t}</div>`;
        }
      }
      body.innerHTML = html;
    }

    fetch('papers.json')
      .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
      .then(data => {
        document.getElementById('update-time').textContent = data.updated_at || '--';
        renderDigest(data.digest, data.updated_at);
        renderPapers('keyword-papers', data.keyword_papers || []);
        renderJournalList(data.journal_papers || {});
        renderHotTopics(data.hot_topics || []);
      })
      .catch(() => {
        document.getElementById('update-time').textContent = '数据未加载';
        document.getElementById('keyword-papers').innerHTML =
          '<p class="empty-msg">请先运行 fetch_papers.py 生成数据</p>';
      });
  </script>
</body>
</html>
